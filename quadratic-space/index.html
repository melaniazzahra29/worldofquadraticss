<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quadratic Space — Belajar • Jelajahi • Selesaikan!</title>
  <!-- Google Fonts: Fredoka/Nunito untuk judul playful, Poppins untuk isi yang jelas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- MathJax untuk Notasi Matematika -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  <style>
    :root {
      /* Palet Warna Cute Playful Academic / Kawaii Learning Space */
      --sage-dark: #5B7B65;
      --sage-main: #7EA189;
      --sage-soft: #B5CBB7;
      --sage-light: #E2ECE4;
      --sage-tint: #F1F6F2;
      --cream: #FDFBF7;
      --off-white: #F8F6F0;
      --pastel-yellow: #FFF3C4;
      --yellow-accent: #F4D06F;
      --peach-soft: #FFD6C9;
      --peach-accent: #F4978E;
      --text-main: #2F3E34;
      --text-muted: #5C6F62;
      --white: #FFFFFF;
      --border-soft: #D5E2D7;
      --shadow-card: 0 8px 24px rgba(91, 123, 101, 0.10);
      --shadow-hover: 0 12px 28px rgba(91, 123, 101, 0.18);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-pill: 999px;
      --transition: all 0.28s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--cream);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
      background-image: 
        radial-gradient(var(--sage-soft) 1.2px, transparent 1.2px),
        radial-gradient(var(--yellow-accent) 1.2px, var(--cream) 1.2px);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
    }

    h1, h2, h3, h4, .font-playful {
      font-family: 'Fredoka', 'Nunito', sans-serif;
      letter-spacing: 0.3px;
    }

    /* Dekorasi Doodle Latar Belakang */
    .floating-doodles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .doodle {
      position: absolute;
      opacity: 0.22;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      color: var(--sage-dark);
      user-select: none;
      animation: floatSlow 7s ease-in-out infinite;
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(4deg); }
    }

    /* Layout Utama: Sidebar + Konten */
    .app-container {
      display: flex;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    /* Sidebar Desktop */
    .sidebar {
      width: 270px;
      background: var(--white);
      border-right: 3px dashed var(--sage-soft);
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 100;
      box-shadow: 4px 0 20px rgba(91, 123, 101, 0.06);
      transition: transform 0.3s ease;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: linear-gradient(135deg, var(--sage-light), var(--pastel-yellow));
      border-radius: var(--radius-lg);
      border: 2px solid var(--sage-soft);
      margin-bottom: 22px;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      background: var(--white);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--sage-dark);
      line-height: 1.2;
    }

    .brand-tagline {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.93rem;
      color: var(--text-muted);
      transition: var(--transition);
      border: 2px solid transparent;
    }

    .nav-item:hover {
      background: var(--sage-tint);
      color: var(--sage-dark);
      transform: translateX(4px);
    }

    .nav-item.active {
      background: var(--sage-main);
      color: var(--white);
      border-color: var(--sage-dark);
      box-shadow: 0 4px 12px rgba(126, 161, 137, 0.35);
    }

    .nav-icon {
      font-size: 1.2rem;
      width: 26px;
      text-align: center;
    }

    .sidebar-mini-progress {
      background: var(--off-white);
      border: 2px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-top: 16px;
    }

    .progress-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--sage-dark);
      margin-bottom: 6px;
    }

    .progress-track {
      width: 100%;
      height: 12px;
      background: var(--sage-light);
      border-radius: var(--radius-pill);
      overflow: hidden;
      border: 1px solid var(--sage-soft);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--sage-main), var(--yellow-accent));
      border-radius: var(--radius-pill);
      transition: width 0.5s ease;
    }

    /* Mobile Header & Drawer */
    .mobile-header {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: var(--white);
      border-bottom: 2px solid var(--sage-light);
      padding: 0 18px;
      align-items: center;
      justify-content: space-between;
      z-index: 110;
    }

    .hamburger-btn {
      background: var(--sage-light);
      border: 2px solid var(--sage-soft);
      border-radius: 12px;
      width: 42px;
      height: 42px;
      font-size: 1.3rem;
      cursor: pointer;
      color: var(--sage-dark);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(47, 62, 52, 0.35);
      z-index: 95;
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      margin-left: 270px;
      padding: 30px 36px 60px;
      max-width: 1280px;
    }

    .page-section {
      display: none;
      animation: fadeSlideUp 0.35s ease forwards;
    }

    .page-section.active {
      display: block;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Komponen Kartu & Sticky Notes */
    .card {
      background: var(--white);
      border-radius: var(--radius-xl);
      border: 2.5px solid var(--border-soft);
      padding: 24px;
      box-shadow: var(--shadow-card);
      position: relative;
      transition: var(--transition);
    }

    .card-hover:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: var(--sage-main);
    }

    .card-corner-star {
      position: absolute;
      top: -12px;
      right: 18px;
      background: var(--pastel-yellow);
      border: 2px solid var(--yellow-accent);
      border-radius: var(--radius-pill);
      padding: 3px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #7A5C12;
      box-shadow: 0 3px 8px rgba(0,0,0,0.06);
    }

    .sticky-note {
      background: var(--pastel-yellow);
      border: 2px dashed #E5C158;
      border-radius: 16px;
      padding: 16px 20px;
      position: relative;
      box-shadow: 3px 5px 0px rgba(229, 193, 88, 0.35);
      transform: rotate(-0.6deg);
      margin: 14px 0;
    }

    .sticky-note.peach {
      background: var(--peach-soft);
      border-color: var(--peach-accent);
      box-shadow: 3px 5px 0px rgba(244, 151, 142, 0.3);
      transform: rotate(0.5deg);
    }

    .sticky-note.sage {
      background: var(--sage-light);
      border-color: var(--sage-main);
      box-shadow: 3px 5px 0px rgba(126, 161, 137, 0.25);
      transform: rotate(0deg);
    }

    /* Tombol Playful */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: var(--radius-pill);
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      border: 2.5px solid transparent;
      transition: var(--transition);
      text-decoration: none;
      user-select: none;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: var(--sage-main);
      color: var(--white);
      border-color: var(--sage-dark);
      box-shadow: 0 4px 0 var(--sage-dark);
    }

    .btn-primary:hover {
      background: var(--sage-dark);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: var(--pastel-yellow);
      color: #6B5010;
      border-color: var(--yellow-accent);
      box-shadow: 0 4px 0 #D9B24C;
    }

    .btn-secondary:hover {
      background: var(--yellow-accent);
      transform: translateY(-2px);
    }

    .btn-peach {
      background: var(--peach-soft);
      color: #7D352E;
      border-color: var(--peach-accent);
      box-shadow: 0 4px 0 #D97A70;
    }

    .btn-outline {
      background: var(--white);
      color: var(--sage-dark);
      border-color: var(--sage-soft);
    }

    .btn-outline:hover {
      background: var(--sage-tint);
      border-color: var(--sage-main);
    }

    .btn-sm {
      padding: 8px 16px;
      font-size: 0.85rem;
    }

    /* Maskot & Speech Bubble */
    .mascot-wrapper {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--white);
      border: 2.5px solid var(--sage-soft);
      border-radius: var(--radius-xl);
      padding: 16px 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-card);
    }

    .mascot-avatar {
      width: 78px;
      height: 78px;
      flex-shrink: 0;
      animation: bounceGentle 3s ease-in-out infinite;
    }

    @keyframes bounceGentle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .speech-bubble {
      background: var(--sage-tint);
      border: 2px solid var(--sage-soft);
      border-radius: 18px;
      padding: 12px 18px;
      position: relative;
      flex: 1;
      font-size: 0.93rem;
    }

    .speech-bubble::before {
      content: '';
      position: absolute;
      left: -10px;
      top: 50%;
      transform: translateY(-50%);
      border-width: 8px 10px 8px 0;
      border-style: solid;
      border-color: transparent var(--sage-soft) transparent transparent;
    }

    /* Hero Section Home */
    .hero-box {
      background: linear-gradient(135deg, var(--white) 0%, var(--sage-light) 55%, var(--pastel-yellow) 100%);
      border: 3px solid var(--sage-soft);
      border-radius: 28px;
      padding: 34px;
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 24px;
      align-items: center;
      box-shadow: var(--shadow-card);
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
    }

    .hero-badge {
      display: inline-block;
      background: var(--peach-soft);
      color: #82352D;
      font-weight: 700;
      font-size: 0.82rem;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      border: 2px solid var(--peach-accent);
      margin-bottom: 12px;
    }

    .hero-title {
      font-size: 2.3rem;
      color: var(--sage-dark);
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    /* Grid Layouts */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    /* Status Pill */
    .status-pill {
      display: inline-block;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      font-size: 0.76rem;
      font-weight: 700;
    }
    .status-not-started { background: #ECEFF1; color: #546E7A; }
    .status-in-progress { background: var(--pastel-yellow); color: #8A6508; border: 1px solid var(--yellow-accent); }
    .status-completed { background: #D4EDDA; color: #1E6B34; border: 1px solid #8FD19E; }

    /* Formula Box */
    .formula-box {
      background: var(--off-white);
      border: 2.5px solid var(--sage-main);
      border-radius: var(--radius-lg);
      padding: 16px 22px;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--sage-dark);
      margin: 14px 0;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.03);
    }

    /* Step-by-Step List */
    .step-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 14px 0;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--sage-tint);
      padding: 10px 16px;
      border-radius: 12px;
      border-left: 4px solid var(--sage-main);
    }

    .step-num {
      width: 28px;
      height: 28px;
      background: var(--sage-main);
      color: var(--white);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    /* Tabs untuk Laboratorium Eksplorasi */
    .lab-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 22px;
    }

    .lab-tab {
      padding: 10px 18px;
      background: var(--white);
      border: 2px solid var(--border-soft);
      border-radius: var(--radius-pill);
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      color: var(--text-muted);
      transition: var(--transition);
    }

    .lab-tab.active {
      background: var(--sage-dark);
      color: var(--white);
      border-color: var(--sage-dark);
    }

    /* Controls & Sliders */
    .slider-group {
      margin-bottom: 14px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--sage-dark);
      cursor: pointer;
      height: 8px;
    }

    input[type="number"], input[type="text"], select {
      padding: 10px 14px;
      border: 2px solid var(--sage-soft);
      border-radius: 12px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      background: var(--white);
      color: var(--text-main);
      width: 100%;
    }

    input:focus {
      outline: none;
      border-color: var(--sage-dark);
    }

    /* Canvas Container */
    .canvas-wrap {
      background: var(--white);
      border: 2.5px solid var(--sage-soft);
      border-radius: var(--radius-lg);
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
    }

    /* Drag & Drop Puzzle */
    .puzzle-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 16px 0;
    }

    .puzzle-piece {
      background: var(--off-white);
      border: 2.5px solid var(--sage-main);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: grab;
      user-select: none;
      transition: var(--transition);
    }

    .puzzle-piece:hover {
      background: var(--pastel-yellow);
    }

    .puzzle-piece.dragging {
      opacity: 0.5;
      border-style: dashed;
    }

    .puzzle-controls {
      display: flex;
      gap: 6px;
    }

    .move-btn {
      background: var(--white);
      border: 1.5px solid var(--sage-soft);
      border-radius: 8px;
      width: 30px;
      height: 30px;
      cursor: pointer;
      font-weight: 700;
      color: var(--sage-dark);
    }

    /* Quiz Options */
    .quiz-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 18px;
      background: var(--off-white);
      border: 2px solid var(--border-soft);
      border-radius: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: var(--transition);
      font-weight: 500;
    }

    .quiz-option:hover {
      background: var(--sage-tint);
      border-color: var(--sage-main);
    }

    .quiz-option.selected {
      background: var(--pastel-yellow);
      border-color: var(--yellow-accent);
      font-weight: 700;
    }

    .quiz-option.correct {
      background: #D4EDDA;
      border-color: #28A745;
    }

    .quiz-option.wrong {
      background: #F8D7DA;
      border-color: #DC3545;
    }

    /* Badges */
    .badge-card {
      text-align: center;
      padding: 18px 14px;
      border-radius: var(--radius-lg);
      border: 2px solid var(--border-soft);
      background: var(--off-white);
      transition: var(--transition);
    }

    .badge-card.unlocked {
      background: linear-gradient(180deg, var(--white), var(--pastel-yellow));
      border-color: var(--yellow-accent);
      box-shadow: 0 6px 16px rgba(244, 208, 111, 0.3);
    }

    .badge-card.locked {
      opacity: 0.55;
      filter: grayscale(85%);
    }

    .badge-icon {
      font-size: 2.4rem;
      margin-bottom: 8px;
      display: block;
    }

    /* Custom Modal & Toast */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(47, 62, 52, 0.45);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal-box {
      background: var(--white);
      border: 3px solid var(--sage-main);
      border-radius: 24px;
      max-width: 460px;
      width: 100%;
      padding: 28px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0,0,0,0.18);
      animation: popIn 0.25s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.88); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .toast-box {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--sage-dark);
      color: var(--white);
      padding: 14px 22px;
      border-radius: var(--radius-pill);
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      z-index: 1000;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
    }

    .toast-box.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* Table styling */
    table.styled-table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
      background: var(--white);
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid var(--sage-soft);
    }

    table.styled-table th {
      background: var(--sage-main);
      color: var(--white);
      padding: 12px;
      text-align: left;
      font-family: 'Nunito', sans-serif;
    }

    table.styled-table td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--sage-light);
    }

    /* Certificate Card */
    .cert-card {
      background: linear-gradient(135deg, #FFFDF7 0%, #F1F6F2 50%, #FFF3C4 100%);
      border: 4px double var(--sage-dark);
      border-radius: 26px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(91, 123, 101, 0.16);
      margin-bottom: 24px;
    }

    /* Responsive Breakpoints */
    @media (max-width: 960px) {
      .hero-box { grid-template-columns: 1fr; text-align: center; }
      .hero-actions { justify-content: center; }
      .grid-3, .grid-4 { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
      .mobile-header { display: flex; }
      .sidebar {
        transform: translateX(-100%);
        width: 260px;
      }

</head>

  <!-- Toast Notification -->

  <script>
    // =========================================================================
    // 1. MANAJEMEN STATE & LOCALSTORAGE
    // =========================================================================
    const STORAGE_KEY = 'quadratic_space_progress_v1';

    const defaultState = {
      points: 0,
      modules: {
        1: { status: 'not-started', quizPassed: false, labDone: false },
        2: { status: 'not-started', quizPassed: false, labDone: false },
        3: { status: 'not-started', quizPassed: false, labDone: false },
        4: { status: 'not-started', quizPassed: false, labDone: false }
      },
      labChallenges: {
        parabolaDown: false,
        parabolaPosC: false,
        discZero: false,
        rootExplorerDone: false,
        puzzleDone: false,
        builderDone: false
      },
      missions: {
        1: false,
        2: false,
        3: false,
        4: false
      },
      evaluation: {
        completed: false,
        score: 0,
        correctCount: 0,
        answers: {}
      },
      badges: {
        firstStep: false,
        conceptExplorer: false,
        discriminantMaster: false,
        equationSolver: false,
        quadraticChampion: false
      }
    };

    let appState = loadState();
    let currentPage = 'home';
    let activeModuleId = 1;
    let activeLabTab = 'playground';

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          return {
            ...defaultState,
            ...parsed,
            modules: { ...defaultState.modules, ...(parsed.modules || {}) },
            labChallenges: { ...defaultState.labChallenges, ...(parsed.labChallenges || {}) },
            missions: { ...defaultState.missions, ...(parsed.missions || {}) },
            evaluation: { ...defaultState.evaluation, ...(parsed.evaluation || {}) },
            badges: { ...defaultState.badges, ...(parsed.badges || {}) }
          };
        }
      } catch (e) {
        console.warn('Gagal memuat localStorage:', e);
      }
      return JSON.parse(JSON.stringify(defaultState));
    }

    function saveState() {
      evaluateBadges();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.warn('Gagal menyimpan localStorage:', e);
      }
      updateSidebarProgress();
    }

    function addPoints(pts) {
      appState.points += pts;
      saveState();
    }

    function evaluateBadges() {
      const m = appState.modules;
      const l = appState.labChallenges;
      const ms = appState.missions;

      // Langkah Pertama: Menyelesaikan minimal 1 aktivitas modul atau misi
      if (m[1].quizPassed || m[1].labDone || ms[1] || l.parabolaDown) {
        appState.badges.firstStep = true;
      }
      // Penjelajah Konsep: Modul 1 selesai & tantangan Taman Parabola tercapai
      if (m[1].status === 'completed' && l.parabolaDown && l.parabolaPosC) {
        appState.badges.conceptExplorer = true;
      }
      // Master Diskriminan: Modul 2 selesai & tantangan D = 0 di Lab Diskriminan tercapai
      if (m[2].status === 'completed' && l.discZero) {
        appState.badges.discriminantMaster = true;
      }
      // Pemecah Persamaan: Modul 3 selesai & Teka-Teki Langkah selesai
      if (m[3].status === 'completed' && l.puzzleDone) {
        appState.badges.equationSolver = true;
      }
      // Juara Kuadrat: Keempat modul selesai & Evaluasi Akhir nilai >= 80
      if (
        m[1].status === 'completed' &&
        m[2].status === 'completed' &&
        m[3].status === 'completed' &&
        m[4].status === 'completed' &&
        appState.evaluation.completed &&
        appState.evaluation.score >= 80
      ) {
        appState.badges.quadraticChampion = true;
      }
    }

    function calculateOverallProgress() {
      let totalTasks = 9; // 4 modul + 4 misi + 1 evaluasi akhir
      let done = 0;
      for (let i = 1; i <= 4; i++) {
        if (appState.modules[i].status === 'completed') done++;
        if (appState.missions[i]) done++;
      }
      if (appState.evaluation.completed) done++;
      return Math.round((done / totalTasks) * 100);
    }

    function updateSidebarProgress() {
      const pct = calculateOverallProgress();
      const bar = document.getElementById('sidebarProgressBar');
      const txt = document.getElementById('sidebarProgressPct');
      const pts = document.getElementById('sidebarPointsText');
      if (bar) bar.style.width = pct + '%';
      if (txt) txt.textContent = pct + '%';
      if (pts) pts.textContent = `✨ ${appState.points} Poin Terkumpul`;
    }

    // =========================================================================
    // 2. MASKOT SVG EKSPRESIF (PARABOLA LUCU "PARABI")
    // =========================================================================
    function getMascotSVG(mood = 'happy', size = 80) {
      let eyes = '';
      let mouth = '';
      let extra = '';

      if (mood === 'happy') {
        eyes = `
          <circle cx="38" cy="48" r="4.5" fill="#2F3E34"/>
          <circle cx="62" cy="48" r="4.5" fill="#2F3E34"/>
          <circle cx="39.5" cy="46.5" r="1.5" fill="#FFF"/>
          <circle cx="63.5" cy="46.5" r="1.5" fill="#FFF"/>
        `;
        mouth = `<path d="M 43 57 Q 50 65 57 57" stroke="#2F3E34" stroke-width="3" fill="none" stroke-linecap="round"/>`;
        extra = `<text x="76" y="26" font-size="14">✨</text>`;
      } else if (mood === 'thinking') {
        eyes = `
          <circle cx="38" cy="46" r="4" fill="#2F3E34"/>

          <path d="M 57 36 Q 63 34 68 38" stroke="#2F3E34" stroke-width="2.5" fill="none"/>
        `;
        mouth = `<circle cx="52" cy="59" r="3.5" fill="#2F3E34"/>`;
        extra = `<text x="74" y="26" font-size="14">💭</text>`;
      } else if (mood === 'amazed') {
        eyes = `
          <text x="31" y="52" font-size="13">⭐</text>
          <text x="55" y="52" font-size="13">⭐</text>
        `;
        mouth = `<ellipse cx="50" cy="60" rx="6" ry="7" fill="#F4978E" stroke="#2F3E34" stroke-width="2.5"/>`;
        extra = `<text x="75" y="24" font-size="15">🎉</text>`;
      } else if (mood === 'encourage') {
        eyes = `
          <path d="M 33 48 Q 38 43 43 48" stroke="#2F3E34" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M 57 48 Q 62 43 67 48" stroke="#2F3E34" stroke-width="3" fill="none" stroke-linecap="round"/>
        `;
        mouth = `<path d="M 44 58 Q 50 62 56 58" stroke="#2F3E34" stroke-width="2.8" fill="none" stroke-linecap="round"/>`;
        extra = `<text x="75" y="26" font-size="14">💪</text>`;
      }

      return `
        <svg width="${size}" height="${size}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <!-- Lingkaran Latar Pastel -->

          <!-- Garis Koordinat Mini -->
          <line x1="16" y1="74" x2="84" y2="74" stroke="#B5CBB7" stroke-width="2" stroke-dasharray="3,3"/>
          <line x1="50" y1="16" x2="50" y2="84" stroke="#B5CBB7" stroke-width="2" stroke-dasharray="3,3"/>
          <!-- Badan Karakter Parabola U -->
          <path d="M 22 26 Q 50 96 78 26" fill="#FFF3C4" stroke="#5B7B65" stroke-width="5.5" stroke-linecap="round"/>
          <!-- Pipi Merona -->
          <ellipse cx="32" cy="54" rx="4.5" ry="2.8" fill="#FFD6C9"/>
          <ellipse cx="68" cy="54" rx="4.5" ry="2.8" fill="#FFD6C9"/>
          ${eyes}
          ${mouth}
          ${extra}
        </svg>
      `;
    }

    // =========================================================================
    // 3. MODAL KUSTOM & NOTIFIKASI TOAST
    // =========================================================================
    function showModal({ title, body, mood = 'happy', buttons = [{ text: 'Oke, Mengerti!', primary: true }] }) {
      const backdrop = document.getElementById('customModal');
      document.getElementById('modalMascot').innerHTML = getMascotSVG(mood, 80);
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = body;

      const btnContainer = document.getElementById('modalButtons');
      btnContainer.innerHTML = '';
      buttons.forEach(btn => {
        const b = document.createElement('button');
        b.className = btn.primary ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
        b.textContent = btn.text;
        b.onclick = () => {
          closeModal();
          if (btn.onClick) btn.onClick();
        };
        btnContainer.appendChild(b);
      });

      backdrop.classList.add('show');
    }

    function closeModal() {
      document.getElementById('customModal').classList.remove('show');
    }

    let toastTimer;
    function showToast(msg) {
      const toast = document.getElementById('toastBox');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // =========================================================================
    // 4. NAVIGASI SPA & RENDER MATHJAX
    // =========================================================================
    function toggleMobileMenu() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('open');
    }

    function navigateTo(page, moduleId = null) {
      currentPage = page;
      if (moduleId) activeModuleId = moduleId;

      document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.page === page);
      });

      document.querySelectorAll('.page-section').forEach(sec => {
        sec.classList.remove('active');
      });

      const target = document.getElementById('page-' + page);
      if (target) target.classList.add('active');

      // Tutup menu samping di ponsel jika terbuka
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('open');

      renderCurrentPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function typesetMath() {
      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise().catch(err => console.log('MathJax:', err));
      }
    }

    function renderCurrentPage() {
      switch (currentPage) {
        case 'home': renderHome(); break;
        case 'map': renderMap(); break;
        case 'modules': renderModule(activeModuleId); break;
        case 'lab': renderLab(); break;
        case 'missions': renderMissions(); break;
        case 'evaluation': renderEvaluation(); break;
        case 'progress': renderProgress(); break;
      }
      typesetMath();
    }

    // =========================================================================
    // 5. HALAMAN 1: BERANDA
    // =========================================================================
    function renderHome() {
      const pct = calculateOverallProgress();
      const container = document.getElementById('page-home');
      container.innerHTML = `
        <div class="hero-box">
          <div>
            <span class="hero-badge">🌿 Dunia Belajar Matematika Interaktif • SMA</span>
            <h1 class="hero-title">Selamat Datang di Quadratic Space!</h1>
            <p style="font-weight:700; color:var(--sage-dark); font-size:1.1rem; margin-bottom:10px;">
              ✨ Belajar • Jelajahi • Selesaikan!
            </p>
            <p style="color:var(--text-muted); font-size:0.96rem;">
              Halo, Penjelajah Matematika! Di ruang belajar digital ini, kamu tidak hanya membaca rumus persamaan kuadrat, 
              tetapi juga bebas menggeser kurva parabola, bereksperimen dengan diskriminan, menyusun teka-teki langkah penyelesaian, dan menaklukkan misi seru bersama <strong>Parabi</strong>!
            </p>
            <div class="hero-actions">
              <button class="btn btn-primary" onclick="navigateTo('map')">🚀 Mulai Belajar</button>
              <button class="btn btn-secondary" onclick="navigateTo('lab')">🧪 Jelajahi Dulu</button>
            </div>
          </div>
          <div style="text-align:center;">
            ${getMascotSVG('happy', 175)}
            <div style="margin-top:8px; font-weight:700; color:var(--sage-dark); font-size:0.9rem;">
              "Hai! Aku Parabi, teman belajarmu!"
            </div>
          </div>
        </div>

        <!-- Ringkasan Progres & Tujuan Pembelajaran -->
        <div class="grid-2" style="margin-bottom:24px;">
          <div class="card">
            <span class="card-corner-star">📊 Statusmu</span>
            <h3 style="color:var(--sage-dark); margin-bottom:10px;">Progres Petualangan Belajar</h3>
            <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:12px;">
              Selesaikan seluruh modul, laboratorium interaktif, dan evaluasi akhir untuk meraih gelar <strong>Juara Kuadrat</strong>!
            </p>
            <div class="progress-label-row">
              <span>Kelengkapan Materi & Misi</span>

            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="font-weight:700; color:var(--sage-dark);">⭐ Total Poin: ${appState.points}</span>
              <button class="btn btn-outline btn-sm" onclick="navigateTo('progress')">Lihat Detail Progres →</button>
            </div>
          </div>

          <div class="card">
            <span class="card-corner-star">🎯 Indikator Capaian</span>
            <h3 style="color:var(--sage-dark); margin-bottom:10px;">Tujuan Pembelajaran</h3>
            <ul style="padding-left:20px; font-size:0.9rem; color:var(--text-main); display:flex; flex-direction:column; gap:6px;">
              <li>Menjelaskan arti dan bentuk umum persamaan kuadrat ($ax^2 + bx + c = 0$).</li>
              <li>Menentukan akar-akar persamaan kuadrat dengan berbagai metode.</li>

            </ul>
          </div>
        </div>

        <!-- Ringkasan 4 Materi Utama -->
        <h2 style="color:var(--sage-dark); margin-bottom:14px;">🗺️ Peta Materi yang Akan Dipelajari</h2>
        <div class="grid-4">
          <div class="card card-hover" style="cursor:pointer;" onclick="navigateTo('modules', 1)">
            <div style="font-size:2rem; margin-bottom:8px;">📐</div>
            <h4 style="color:var(--sage-dark);">01. Bentuk Umum & Grafik</h4>
            <p style="font-size:0.84rem; color:var(--text-muted); margin-top:6px;">
              Mengenal $ax^2 + bx + c = 0$ serta pengaruh nilai $a$, $b$, dan $c$ pada kurva parabola.
            </p>
          </div>
          <div class="card card-hover" style="cursor:pointer;" onclick="navigateTo('modules', 2)">
            <div style="font-size:2rem; margin-bottom:8px;">🔍</div>
            <h4 style="color:var(--sage-dark);">02. Diskriminan & Jenis Akar</h4>
            <p style="font-size:0.84rem; color:var(--text-muted); margin-top:6px;">
              Menyelidiki akar real berbeda, kembar, atau imajiner melalui $D = b^2 - 4ac$.
            </p>
          </div>
          <div class="card card-hover" style="cursor:pointer;" onclick="navigateTo('modules', 3)">
            <div style="font-size:2rem; margin-bottom:8px;">🧩</div>
            <h4 style="color:var(--sage-dark);">03. Metode Penyelesaian</h4>
            <p style="font-size:0.84rem; color:var(--text-muted); margin-top:6px;">
              Menguasai teknik Faktorisasi, Kuadrat Sempurna, dan Rumus Kuadrat ABC.

          </div>

    }

    // =========================================================================
    // 6. HALAMAN 2: PETA BELAJAR
    // =========================================================================
    const modulesMeta = [
      {
        id: 1,
        code: 'MODUL 01',
        title: 'Mengenal Persamaan Kuadrat',
        icon: '📈',
        time: '15 Menit',
        desc: 'Pengertian persamaan kuadrat, bentuk umum ax² + bx + c = 0, variabel, koefisien, konstanta, serta pengaruh nilai a, b, dan c pada bentuk dan posisi parabola.'
      },
      {
        id: 2,
        code: 'MODUL 02',
        title: 'Menemukan Jenis Akar',
        icon: '🌱',
        time: '15 Menit',
        desc: 'Pengertian akar-akar persamaan kuadrat, rumus diskriminan D = b² − 4ac, serta klasifikasi akar real berbeda (D > 0), akar kembar (D = 0), dan imajiner (D < 0).'

        code: 'MODUL 03',
        title: 'Menyelesaikan Persamaan Kuadrat',
        icon: '⚙️',

      },
      {

        code: 'MODUL 04',
        title: 'Menyusun Persamaan Kuadrat Baru',
        icon: '🧱',
        time: '15 Menit',
        desc: 'Menyusun persamaan kuadrat baru jika diketahui akar-akarnya (x − x₁)(x − x₂) = 0 maupun jika diketahui jumlah dan hasil kali akar-akarnya.'
      }
    ];

    function renderMap() {
      const container = document.getElementById('page-map');
      let cardsHTML = modulesMeta.map(mod => {
        const st = appState.modules[mod.id].status;
        let statusLabel = 'Belum Dimulai';
        let statusClass = 'status-not-started';
        let btnText = 'Mulai Modul ▶';

        if (st === 'in-progress') {
          statusLabel = 'Sedang Berjalan';

    // =========================================================================
    // 8. FUNGSI MENGGAMBAR GRAFIK PARABOLA DINAMIS (CANVAS)
    // =========================================================================
    function drawParabolaOnCanvas(canvasId, a, b, c) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;
      const cx = W / 2;
      const cy = H / 2;
      const scale = 24; // 24px per 1 satuan

      ctx.clearRect(0, 0, W, H);

      // Latar belakang lembut
      ctx.fillStyle = '#FDFBF7';
      ctx.fillRect(0, 0, W, H);

      // Grid kotak-kotak
      ctx.strokeStyle = '#E2ECE4';
      ctx.lineWidth = 1;
      for (let x = cx % scale; x < W; x += scale) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      for (let y = cy % scale; y < H; y += scale) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }

      // Sumbu X dan Y
      ctx.strokeStyle = '#5B7B65';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(W, cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, H); ctx.stroke();

      // Label angka pada sumbu
      ctx.fillStyle = '#5C6F62';
      ctx.font = '10px Poppins';
      for (let i = -7; i <= 7; i++) {
        if (i !== 0) {
          ctx.fillText(i, cx + i * scale - 4, cy + 12);
          ctx.fillText(-i, cx + 5, cy + i * scale + 3);
        }
      }

      // Gambar garis sumbu simetri putus-putus
      const xv = -b / (2 * a);
      const yv = a * xv * xv + b * xv + c;
      const pxXv = cx + xv * scale;

      ctx.save();
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = '#F4978E';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(pxXv, 0);
      ctx.lineTo(pxXv, H);
      ctx.stroke();
      ctx.restore();

      // Gambar Kurva Parabola y = ax^2 + bx + c
      ctx.strokeStyle = '#2F3E34';
      ctx.lineWidth = 3;
      ctx.beginPath();
      let started = false;
      for (let px = 0; px <= W; px += 2) {
        const mathX = (px - cx) / scale;
        const mathY = a * mathX * mathX + b * mathX + c;
        const py = cy - mathY * scale;
        if (py >= -100 && py <= H + 100) {
          if (!started) {
            ctx.moveTo(px, py);
            started = true;
          } else {
            ctx.lineTo(px, py);
          }
        }
      }
      ctx.stroke();

      // Titik Potong Sumbu Y (0, c)
      const pyC = cy - c * scale;
      if (pyC >= 0 && pyC <= H) {
        ctx.fillStyle = '#F4D06F';
        ctx.strokeStyle = '#2F3E34';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, pyC, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      // Titik Puncak (xv, yv)
      const pyYv = cy - yv * scale;
      if (pxXv >= 0 && pxXv <= W && pyYv >= 0 && pyYv <= H) {
        ctx.fillStyle = '#F4978E';
        ctx.strokeStyle = '#2F3E34';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(pxXv, pyYv, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
    }

    // --- 9A. Logika Taman Parabola ---
    function updatePlayground() {

      const c = parseFloat(document.getElementById('pgSliderC').value);

      document.getElementById('pgLabelA').textContent = a;
      document.getElementById('pgLabelB').textContent = b;
      document.getElementById('pgLabelC').textContent = c;

      const signB = b >= 0 ? `+ ${b}` : `- ${Math.abs(b)}`;
      const signC = c >= 0 ? `+ ${c}` : `- ${Math.abs(c)}`;
      document.getElementById('pgFormulaDisplay').innerHTML = `$$y = ${a}x^2 ${signB}x ${signC}$$`;

      const arah = a > 0 ? 'Terbuka ke atas (cekung)' : 'Terbuka ke bawah (cembung)';
      const potongY = `(0, ${c})`;
      const xv = (-b / (2 * a));
      const yv = (a * xv * xv + b * xv + c);
      const pdfSym = (b / (2 * a));

      document.getElementById('pgDetailsBox').innerHTML = `
        • <strong>Koefisien & Konstanta:</strong> $a = ${a},\\; b = ${b},\\; c = ${c}$<br>
        • <strong>Arah Parabola:</strong> ${arah}<br>
        • <strong>Titik Potong Sumbu y:</strong> ${potongY}<br>

      `;

      if (a < 0 && !appState.labChallenges.parabolaDown) {
        appState.labChallenges.parabolaDown = true;

        showToast('🎉 Tantangan tercapai: Parabola terbuka ke bawah!');

    // --- 9B. Logika Lab Diskriminan ---
    function updateDiscriminantLab() {
      const inpA = document.getElementById('dlInputA');
      if (!inpA) return;
      let a = parseFloat(inpA.value);
      if (isNaN(a) || a === 0) {
        a = 1;
        inpA.value = 1;
        showToast('Nilai a tidak boleh nol!');
      }
      const b = parseFloat(document.getElementById('dlInputB').value) || 0;
      const c = parseFloat(document.getElementById('dlInputC').value) || 0;

      const D = b * b - 4 * a * c;
      let jenis = '';
      let ket = '';
      let noteClass = 'sage';

      if (D > 0) {
        jenis = 'Dua Akar Real Berbeda ($D > 0$)';
        ket = 'Kurva memotong sumbu $x$ di dua titik berlainan ($x_1 \\neq x_2$).';
        noteClass = 'sage';
      } else if (D === 0) {
        jenis = 'Dua Akar Real Kembar ($D = 0$)';
        ket = 'Kurva menyinggung sumbu $x$ tepat di satu titik ($x_1 = x_2$).';
        noteClass = '';
        if (!appState.labChallenges.discZero) {
          appState.labChallenges.discZero = true;
          addPoints(40);
          const stEl = document.getElementById('dlChallengeStatus');
          if (stEl) stEl.textContent = '✅ Berhasil Terpenuhi! (+40 Poin)';

        }
      } else {
        jenis = 'Akar Imajiner / Tidak Real ($D < 0$)';
        ket = 'Kurva tidak memotong maupun menyentuh sumbu $x$.';
        noteClass = 'peach';
      }

      const resCard = document.getElementById('dlResultCard');
      resCard.className = `sticky-note ${noteClass}`;
      resCard.innerHTML = `

          $D = b^2 - 4ac$<br>

        <p style="font-size:0.92rem;"><strong>Jenis Akar:</strong> ${jenis}</p>
        <p style="font-size:0.85rem; margin-top:4px;">${ket}</p>
      `;

      drawParabolaOnCanvas('dlCanvas', a, b, c);
      typesetMath();
    }

          ` : `

    function drawNumberLine(x1, x2, isImaginary = false) {
      const canvas = document.getElementById('numberLineCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;
      const cy = H / 2 + 6;
      const cx = W / 2;
      const step = 30;

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#FDFBF7';
      ctx.fillRect(0, 0, W, H);

      // Garis utama
      ctx.strokeStyle = '#5B7B65';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(20, cy);
      ctx.lineTo(W - 20, cy);
      ctx.stroke();

      ctx.fillStyle = '#2F3E34';
      ctx.font = '11px Poppins';
      for (let i = -7; i <= 7; i++) {
        const px = cx + i * step;
        ctx.beginPath();
        ctx.moveTo(px, cy - 6);
        ctx.lineTo(px, cy + 6);
        ctx.stroke();
        ctx.fillText(i, px - 4, cy + 20);
      }

      if (isImaginary) {
        ctx.fillStyle = '#82352D';
        ctx.font = 'bold 13px Nunito';
        ctx.fillText('Tidak ada akar real pada garis bilangan (D < 0)', cx - 145, 24);
        return;
      }

      if (x1 !== null) {
        const px1 = cx + x1 * step;
        ctx.fillStyle = '#7EA189';
        ctx.strokeStyle = '#2F3E34';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(px1, cy, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#2F3E34';
        ctx.font = 'bold 12px Nunito';
        ctx.fillText(`x₁=${x1}`, px1 - 14, cy - 14);
      }

      if (x2 !== null && x2 !== x1) {
        const px2 = cx + x2 * step;
        ctx.fillStyle = '#F4D06F';
        ctx.strokeStyle = '#2F3E34';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(px2, cy, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#2F3E34';
        ctx.font = 'bold 12px Nunito';
        ctx.fillText(`x₂=${x2}`, px2 - 14, cy - 14);
      }
    }

    // =========================================================================

    // =========================================================================
    const evalQuestions = [
      {

        opts: ['$ax + b = 0$', '$ax^2 + bx + c = 0$ dengan $a \\neq 0$', '$ax^3 + bx^2 + c = 0$', '$ax^2 + by^2 = c$'],

        exp: '$D = 2^2 - 4(1)(4) = 4 - 16 = -12 < 0$, sehingga akarnya imajiner / tidak real.'
      },
      {

        ans: 0,
        exp: '$(5x + 3)(x + 2) = 0 \\Rightarrow x = -\\frac{3}{5}$ atau $x = -2$.'
      },
      {

        opts: ['$3$', '$6$', '$9$', '$25$'],

        ans: 1,
        exp: '$(x - (-2))(x - 3) = (x + 2)(x - 3) = x^2 - x - 6 = 0$.'
      },
      {

        exp: '$x^2 - \\frac{5}{2}x - \\frac{3}{2} = 0$, dikalikan 2 menjadi $2x^2 - 5x - 3 = 0$.'

        opts: ['$x^2 + 7x + 10 = 0$', '$x^2 - 7x + 10 = 0$', '$x^2 - 7x - 10 = 0$', '$x^2 + 10x + 7 = 0$'],
        ans: 1,
        exp: 'Substitusi ke $x^2 - (x_1 + x_2)x + (x_1 x_2) = 0$ menghasilkan $x^2 - 7x + 10 = 0$.'

    let currentEvalIdx = 0;
    let userEvalAnswers = {};
    let evalSubmitted = false;

    function renderEvaluation() {
      const container = document.getElementById('page-evaluation');

      if (evalSubmitted) {
        renderEvaluationResult(container);
        return;
      }

      const qObj = evalQuestions[currentEvalIdx];
      const answeredCount = Object.keys(userEvalAnswers).length;

      container.innerHTML = `
        <div class="mascot-wrapper">
          <div class="mascot-avatar">${getMascotSVG('thinking', 74)}</div>
          <div class="speech-bubble">
            <strong>Evaluasi Akhir — Uji Pemahaman Akhir! 🏆</strong><br>
            Jawab seluruh <strong>${evalQuestions.length} soal</strong> berikut dengan teliti. Kamu bisa berpindah nomor soal kapan saja sebelum menekan tombol <strong>Kumpulkan Evaluasi</strong>.
          </div>
        </div>

        <!-- Indikator Nomor Soal -->
        <div class="card" style="margin-bottom:18px; padding:16px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <strong style="font-size:0.9rem; color:var(--sage-dark);">Navigasi Nomor Soal (${answeredCount}/${evalQuestions.length} terjawab)</strong>
            <span style="font-size:0.82rem; color:var(--text-muted);">Soal ke-${currentEvalIdx + 1}</span>
          </div>
          <div style="display:flex; flex-wrap:wrap; gap:6px;">
            ${evalQuestions.map((_, i) => {
              const isCurr = i === currentEvalIdx;
              const isAns = userEvalAnswers[i] !== undefined;
              let bg = 'var(--off-white)';
              let col = 'var(--text-main)';
              if (isCurr) { bg = 'var(--sage-dark)'; col = '#FFF'; }
              else if (isAns) { bg = 'var(--pastel-yellow)'; col = '#6B5010'; }
              return `
                <button onclick="jumpEvalQuestion(${i})" style="width:34px; height:34px; border-radius:10px; border:2px solid var(--sage-soft); background:${bg}; color:${col}; font-weight:700; cursor:pointer;">
                  ${i + 1}
                </button>
              `;
            }).join('')}
          </div>
        </div>

        <!-- Kartu Soal Aktif -->
        <div class="card">
          <span class="card-corner-star">Soal ${currentEvalIdx + 1} dari ${evalQuestions.length}</span>
          <h3 style="color:var(--text-main); margin:10px 0 18px; font-family:'Poppins', sans-serif; font-size:1.05rem;">
            ${currentEvalIdx + 1}. ${qObj.q}
          </h3>

          <div>
            ${qObj.opts.map((opt, oIdx) => {
              const isSel = userEvalAnswers[currentEvalIdx] === oIdx;
              const letter = ['A', 'B', 'C', 'D'][oIdx];
              return `
                <div class="quiz-option ${isSel ? 'selected' : ''}" onclick="selectEvalOption(${oIdx})">
                  <strong style="color:var(--sage-dark);">${letter}.</strong> <span>${opt}</span>
                </div>
              `;
            }).join('')}
          </div>

          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:22px; padding-top:16px; border-top:2px dashed var(--border-soft);">
            <button class="btn btn-outline" ${currentEvalIdx === 0 ? 'disabled style="opacity:0.4;"' : `onclick="jumpEvalQuestion(${currentEvalIdx - 1})"`}>
              ← Sebelumnya
            </button>
            ${currentEvalIdx < evalQuestions.length - 1
              ? `<button class="btn btn-primary" onclick="jumpEvalQuestion(${currentEvalIdx + 1})">Berikutnya →</button>`
              : `<button class="btn btn-peach" onclick="confirmSubmitEvaluation()">Kumpulkan Evaluasi 🏆</button>`
            }
          </div>
        </div>
      `;
    }

    function jumpEvalQuestion(idx) {
      currentEvalIdx = idx;
      renderEvaluation();
      typesetMath();
    }

    function selectEvalOption(oIdx) {
      userEvalAnswers[currentEvalIdx] = oIdx;
      renderEvaluation();
      typesetMath();
    }

    function confirmSubmitEvaluation() {
      const answered = Object.keys(userEvalAnswers).length;
      const total = evalQuestions.length;
      const msg = answered < total
        ? `Kamu baru menjawab <strong>${answered} dari ${total} soal</strong>. Apakah kamu yakin ingin mengumpulkan evaluasi sekarang?`
        : `Kamu telah menjawab seluruh <strong>${total} soal</strong>! Siap melihat hasil dan sertifikat pencapaianmu?`;

      showModal({
        title: 'Konfirmasi Pengumpulan Evaluasi',
        body: msg,
        mood: 'thinking',
        buttons: [
          { text: 'Periksa Lagi', primary: false },
          { text: 'Ya, Kumpulkan Sekarang!', primary: true, onClick: finalizeEvaluation }
        ]
      });
    }

    function finalizeEvaluation() {
      let correct = 0;
      evalQuestions.forEach((q, idx) => {
        if (userEvalAnswers[idx] === q.ans) correct++;
      });

      const score = Math.round((correct / evalQuestions.length) * 100);
      evalSubmitted = true;

      if (!appState.evaluation.completed || score > appState.evaluation.score) {
        appState.evaluation.score = score;
        appState.evaluation.correctCount = correct;
      }
      if (!appState.evaluation.completed) {
        addPoints(100);
      }
      appState.evaluation.completed = true;
      appState.evaluation.answers = { ...userEvalAnswers };
      saveState();

      renderEvaluation();
      typesetMath();
    }

    function renderEvaluationResult(container) {
      let correct = 0;
      evalQuestions.forEach((q, idx) => {
        if (userEvalAnswers[idx] === q.ans) correct++;
      });
      const wrong = evalQuestions.length - correct;
      const score = Math.round((correct / evalQuestions.length) * 100);

      let motivation = '';
      let mood = 'happy';
      if (score >= 85) {
        motivation = 'Luar biasa! Penguasaanmu terhadap materi Persamaan Kuadrat sangat mengagumkan. Kamu layak menyandang gelar Juara Kuadrat!';
        mood = 'amazed';
      } else if (score >= 70) {
        motivation = 'Kerja bagus! Kamu sudah memahami sebagian besar konsep dengan baik. Tinjau kembali pembahasan soal di bawah untuk menyempurnakannya!';
        mood = 'happy';

        motivation = 'Tetap semangat! Belajar matematika adalah proses bertahap. Yuk pelajari pembahasan di bawah dan ulangi evaluasi kapan saja!';
        mood = 'encourage';

      const reviewHTML = evalQuestions.map((q, idx) => {
        const uAns = userEvalAnswers[idx];

        const letters = ['A', 'B', 'C', 'D'];
        return `
          <div style="background:${isRight ? '#F1F8F3' : '#FFF5F4'}; border:2px solid ${isRight ? '#8FD19E' : '#F4978E'}; border-radius:16px; padding:16px; margin-bottom:12px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
              <strong>Soal ${idx + 1}</strong>

              💡 <strong>Pembahasan:</strong> ${q.exp}

          </div>
        `;
      }).join('');

      container.innerHTML = `
        <div class="cert-card">
          <div style="margin-bottom:10px;">${getMascotSVG(mood, 96)}</div>
          <span style="background:var(--pastel-yellow); border:2px solid var(--yellow-accent); padding:4px 16px; border-radius:99px; font-weight:800; font-size:0.82rem;">
            🏅 SERTIFIKAT PENCAPAIAN
          </span>
          <h2 style="color:var(--sage-dark); font-size:1.8rem; margin:12px 0 6px;">Hasil Evaluasi Quadratic Space</h2>
          <div style="font-size:3rem; font-weight:800; color:var(--sage-dark); font-family:'Fredoka', sans-serif; margin:8px 0;">
            Nilai: ${score}
          </div>
          <div style="display:flex; justify-content:center; gap:20px; margin:12px 0; font-weight:700;">
            <span style="color:#1E6B34;">✔ Benar: ${correct}</span>
            <span style="color:#82352D;">✘ Salah: ${wrong}</span>
            <span style="color:var(--sage-dark);">📋 Total: ${evalQuestions.length} Soal</span>
          </div>
          <p style="max-width:600px; margin:12px auto 20px; font-size:0.95rem; color:var(--text-main);">
            "${motivation}"
          </p>
          <div style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="retakeEvaluation()">🔄 Ulangi Evaluasi</button>
            <button class="btn btn-secondary" onclick="navigateTo('progress')">🌟 Lihat Lencana & Progres</button>
          </div>
        </div>

        <h3 style="color:var(--sage-dark); margin-bottom:14px;">📖 Pembahasan Lengkap Setiap Soal</h3>
        ${reviewHTML}
      `;
    }

    function retakeEvaluation() {
      currentEvalIdx = 0;
      userEvalAnswers = {};
      evalSubmitted = false;
      renderEvaluation();
      typesetMath();
    }
